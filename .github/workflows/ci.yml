name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Install Julia ground-truth deps
        run: julia --project=juliaenv -e 'import Pkg; Pkg.instantiate()'
      - name: Install Python deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
