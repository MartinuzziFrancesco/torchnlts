[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchnlts"
version = "0.1.0"
description = "Differentiable nonlinear time series analysis on PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "dysts",
    "torchdiffeq",
]

[project.optional-dependencies]
dev = ["pytest", "numpy"]
sde = ["torchsde"]

[tool.setuptools.packages.find]
include = ["torchnlts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
